# pnpm workspace for the published packages under packages/* —
# `@thomasfosterau/effect-utilities` and the `@thomasfosterau/effect-ai-*` /
# `effect-evals` family (merged in from thomasfosterau/effect-ai-ext) — plus
# the dist-consumer declaration check under tests/*.
#
# The `catalog:` protocol pins versions that MUST be singletons across the
# workspace. Effect especially: two copies of `effect` break Context / Layer /
# Schema identity at runtime, so every package references `catalog:`.
#
# EVERY external dependency version lives here — package.json files reference
# only `catalog:` / `catalog:peers` (or `workspace:*` for internal packages).
# `catalogMode: strict` makes `pnpm add` enforce this at add time and
# `pnpm install` reject non-catalog specifiers. After editing this catalog,
# ALWAYS run `pnpm install` and commit the regenerated pnpm-lock.yaml — a stale
# lockfile fails CI at once with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# The shared toolchain (vite-plus, the TypeScript 6/7 pair, @effect/tsgo, the
# Effect oxlint plugin, fallow) is kept in lockstep with the effect-web
# library, the family's reference workspace, and with the consuming
# applications' catalogs wherever they overlap: the apps consume the Schema
# modules, so the library builds against what they run.
packages:
  - packages/*
  - tests/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  # The gateway's optional, types-only peer (see `catalogs.peers`); the dev pin
  # is what its binding-compatibility test checks a real `Ai` against.
  "@cloudflare/workers-types": ^5.20261029.1
  # The Effect line (see the header): equal to `effect` below.
  "@effect/ai-anthropic": 4.0.6
  # Compiles AND executes every JSDoc `@example` in packages/*/src (the
  # `docgen` task). Its `typescript` peer (`^5`) resolves to the TS6 alias
  # below, which pnpm tolerates via `peerDependencyRules`; the JS API it uses
  # is unchanged in 6. Exact, and no newer than the Effect line: docgen
  # depends on `effect` itself (4.1.2 on `effect ^4.1.2`, for
  # `effect/process/CommandLine`), and the `effect` override below forces
  # the catalog `effect` onto it, so a docgen ahead of `effect` crashes on
  # launch. Move it with the Effect line, not in its own Dependabot group.
  "@effect/docgen": 4.0.6
  "@effect/language-service": ^0.87.5
  # Optional peer of effect-utilities: only the `Browser` and
  # `BrowserTesting` modules import it (its `Permissions`, `Clipboard` and
  # `Geolocation` services). The Effect line: equal to `effect`, since its own
  # peer is `effect: ^<its version>`.
  "@effect/platform-browser": 4.0.6
  # `effect-evals`' optional CLI peer. Equal to `effect`.
  "@effect/platform-node": 4.0.6
  # Transitive only (via @effect/platform-node's `^` range); pinned and
  # overridden so it cannot float ahead of `effect`. BUMP BY HAND with the rest
  # of the Effect line: no manifest names it, so Dependabot's `effect` group
  # never proposes it, and nothing flags a stale pin — the `effect` override
  # rewrites its peer spec too, so `pnpm peers check` stays silent.
  "@effect/platform-node-shared": 4.0.6
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` binary
  # with an Effect-patched build matched by gitHead, so this pins in lockstep
  # with `@typescript/native` below and with the `oxlint` that `vite-plus`
  # pulls in: 0.63.0 supports typescript 7.0.2, oxlint 1.88.0 - 1.90.0 and
  # oxlint-tsgolint 7.0.2004 / 7.0.2005, and hard-errors
  # (UnsupportedTargetPackageVersionError) on anything else — failing
  # `pnpm install` itself in the `prepare` script. Read the `components`
  # table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs before bumping
  # any of the three.
  "@effect/tsgo": 0.67.1
  # Lockstep with `effect`: @effect/vitest is released on the same version
  # line. The `it.effect` runner the Allocator / Vec / String tests use.
  "@effect/vitest": 4.0.6
  # The Effect oxlint rules (`effect/*`, the anti-slop set included), loaded
  # by `vite.config.ts` through `configs.recommended`. It replaces
  # `@mpsuesser/oxlint-plugin-effect`. 0.9.0 depends on `effect` 4.1.0 (exact)
  # but runs on the workspace singleton (the `effect` override below), and it
  # loads inside vite-plus's oxlint, so it moves in the `toolchain` group and
  # an `effect` bump re-runs `vp check` against it too.
  "@enfect/oxlint": 0.10.0
  # Optional peer of effect-utilities: only the `Negotiate` module imports it
  # (the JSON:API §5/§6 media-type rules are adopted from its `Middleware`,
  # never re-implemented here).
  "@thomasfosterau/effect-jsonapi": ^0.20.0
  # Optional peer of effect-utilities: the `Robots` line grammar is an
  # effect-parse parser, decoded through its `ParserSchema` (effect-web#113).
  "@thomasfosterau/effect-parse": ^0.4.1
  "@types/node": ^26.6.6
  # Must match `vitest` below (its peer is the exact vitest version).
  "@vitest/coverage-istanbul": 5.1.0
  # Exact, like `@effect/vitest`: the dev pin is what every gate ran on, and
  # Dependabot's `effect` group moves both together. The published range is
  # `catalogs.peers` below.
  effect: 4.0.6
  fallow: 3.39.0
  # The property tests behind effect-utilities' numeric modules (merged in
  # from thomasfosterau/effect-numeric): arithmetic laws checked against a
  # `bigint` reference. Test-only, never a dependency of `dist/`.
  fast-check: ^4.10.2
  # Only because `@effect/docgen` requires it as a peer and spawns the `tsx`
  # binary itself to run each example. Nothing else uses it: scripts run with
  # `vpx <file>.ts`.
  tsx: ^4.23.15
  # TypeScript 6/7 side-by-side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service, @effect/docgen)
  # stay on TS6 while native `tsc` type-checks this library. The alias keeps
  # the package importable as `typescript` name-stable at the TS6 JS compiler
  # (bin `tsc6`); `@typescript/native` is TS7 (bin `tsc`). Pinned exact:
  # @typescript/native's gitHead must match @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions, so this
  # entry decides the oxlint `effect-tsgo patch --oxlint` has to support (see
  # the @effect/tsgo note above): 1.5.0 carries oxlint 1.91.0 and
  # oxlint-tsgolint 7.0.2005. `vite` is the same release under its aliased
  # core package, and `vitest` must match vite-plus's exact pin
  # (1.5.0 -> 5.1.0, `vp toolchain vitest`) because the `vitest@*` override
  # forces every semver resolution to the catalog singleton.
  vite-plus: 1.5.0
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest: 5.1.0

# Peer ranges the PUBLISHED packages declare. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges (an exact
# `4.0.0-rc.115` peer would reject a consumer on rc.116). `pnpm pack` replaces
# `catalog:peers` with these ranges in the published manifest (see
# scripts/release.sh). The floor is the oldest `effect` every package has been
# type-checked, tested and had its examples run against: 4.0.0, the first
# stable release (raised from rc.118 in #30). The AI packages'
# `@effect/ai-anthropic` / `@effect/platform-node` peers share it.
#
# `@cloudflare/workers-types` is the gateway's optional, types-only peer. The
# gateway's `dist/index.d.ts` names nothing from it (the Worker binding is
# typed by the gateway's own structural `WorkersAiBinding`), so the floor is
# the first release whose `Ai` is assignable to `WorkersAiBinding`:
# 4.20250312.0, the first whose `AiGateway` declares `getUrl()`. Re-verify
# assignability at the floor before moving it.
#
# effect-utilities' three optional peers (merged in from
# thomasfosterau/effect-web) each serve only the modules that import them:
# `@effect/platform-browser` (`Browser`, `BrowserTesting`; its 4.0.0 is the
# first stable release, on the `effect` floor), `@thomasfosterau/effect-jsonapi`
# (`Negotiate`) and `@thomasfosterau/effect-parse` (`Robots`).
catalogs:
  peers:
    "@cloudflare/workers-types": ">=4.20250312.0"
    "@effect/ai-anthropic": ">=4.0.0"
    "@effect/platform-browser": ">=4.0.0"
    "@effect/platform-node": ">=4.0.0"
    "@thomasfosterau/effect-jsonapi": ">=0.16.1"
    # Caret, not `>=`: on 0.x a minor release may break the combinator API
    # the robots grammar is written against.
    "@thomasfosterau/effect-parse": ^0.4.1
    effect: ">=4.0.0"

overrides:
  # undici <8.12.2 — GHSA-xjj6-f33q-929c (high): an unhandled error on a
  # response with excessive content-encodings is a denial of service
  # (#68). Reached transitively (@effect/platform-node > undici), whose
  # range admits the fix but whose lockfile resolution stayed below it.
  # Drop once that resolution reaches >=8.12.2 on its own.
  undici: ^8.12.2
  # glob 9.0.0 - 14.0.1 — GHSA-3g3m-2fjr-6pw4 and minimatch 7.0.0 - 11.0.0 —
  # GHSA-g3hv-75wg-m249 (both moderate, denial of service), reached only
  # through dev tooling: @effect/docgen declares `glob: ^13` and ts-morph's
  # @ts-morph/common `minimatch: ^10` (#84, owner decision 2026-11-05). glob 14
  # brings minimatch ^11.0.2 with it. `vp run docgen` is the check that the
  # majors still work. Drop each once docgen / ts-morph range past it.
  "@effect/docgen>glob": ^14.0.2
  "@ts-morph/common>minimatch": ^11.0.1
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: "catalog:"
  # Keep equal to `effect`'s pin (bumped by hand, see its catalog entry).
  "@effect/platform-node-shared": "catalog:"
  # Vite+'s managed pins (`vp migrate`): the `@*` range keeps the override on
  # transitive / peer semver ranges and leaves `catalog:` references intact.
  vite@*: "catalog:"
  vitest@*: "catalog:"
nodeLinker: hoisted
# msgpackr-extract arrives via @effect/platform-node and builds an optional
# native accelerator.
allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
    # @effect/docgen declares `typescript: ^5`; the workspace's `typescript`
    # is the TS6 alias (see the catalog note).
    - typescript
  allowedVersions:
    vite: "*"
    vitest: "*"
    typescript: "*"

# Supply-chain delay (owner's policy, gardeneria #1149): hold newly published
# versions for 8 hours (unit: MINUTES) before pnpm will install them.
# Dependabot's `cooldown` (.github/dependabot.yml) takes whole days only, so it
# waits 1 day, longer than this: it never proposes a version pnpm would refuse.
# The toolchain gets no exemption (`vp migrate` adds one; it was removed).
minimumReleaseAge: 480
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
