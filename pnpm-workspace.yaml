# Every external version lives here (`catalogMode: strict`); package.json files
# reference only `catalog:`, a named peers catalog or `workspace:*`.
packages:
  - packages/*
  - tests/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@cloudflare/workers-types": ^5.20261125.1
  # The Effect line: `effect` and every `@effect/*` runtime package below share
  # one exact version (Dependabot's `effect` group).
  "@effect/ai-anthropic": 4.1.5
  "@effect/ai-cloudflare": 4.1.5
  # Depends on `effect` itself, so it never runs ahead of the `effect` pin.
  "@effect/docgen": 4.1.5
  "@effect/language-service": ^0.87.5
  "@effect/platform-browser": 4.1.5
  "@effect/platform-node": 4.1.5
  # Transitive only (via @effect/platform-node), pinned through `overrides` so
  # it can't float ahead of `effect`. No manifest names it: bump it by hand.
  "@effect/platform-node-shared": 4.1.5
  # `effect-tsgo patch` (the `prepare` script) supports only the TypeScript /
  # oxlint / tsrs versions in the `components` table of
  # node_modules/@effect/tsgo/dist/effect-tsgo.cjs, and fails `pnpm install`
  # on anything else: check it before moving this, `@typescript/native` or
  # `vite-plus`.
  "@effect/tsgo": 0.73.4
  "@effect/vitest": 4.1.5
  "@enfect/oxlint": 0.10.0
  "@thomasfosterau/effect-parse": ^0.6.2
  "@types/node": ^26.6.10
  "@vitest/coverage-istanbul": 5.1.1
  effect: 4.1.5
  fallow: 3.48.0
  fast-check: ^4.11.0
  # TS7 has no JS API yet: JS-API consumers (the language service, docgen)
  # get TS6 as `typescript`; the native TS7 `tsc` is `@typescript/native`.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # `vite` and `vitest` equal what vite-plus itself depends on
  # (`npm view vite-plus@<v> dependencies`); `vite` no longer equals vite-plus.
  vite-plus: 1.8.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vitest: 5.1.1

# Peer ranges of the published packages. `effect` is `^4.0.5` (Har and Warc
# redact query parameters through `UrlParams.CurrentRedactedNames`, first in
# 4.0.5) unless a package's own dependency needs more, in a catalog of its own
# that says why.
catalogs:
  peers:
    "@effect/ai-anthropic": ^4.0.0
    "@effect/platform-browser": ^4.0.0
    "@effect/platform-node": ^4.0.0
    # Each 0.x minor in the union passed the gates.
    "@thomasfosterau/effect-parse": ^0.4.1 || ^0.5.0 || ^0.6.0
    effect: ^4.0.5
  # effect-ai-cloudflare: AI Gateway routing (`gatewayId`) first shipped in
  # @effect/ai-cloudflare 4.0.6, which peers on `effect ^4.0.6`.
  ai-cloudflare-peers:
    "@effect/ai-cloudflare": ^4.0.6
    effect: ^4.0.6
  # The four first-party providers: Effect 4.1 changed `AiError`'s request
  # details and `Response` metadata, so they can't support 4.0 and 4.1 at once.
  ai-4-1-peers:
    effect: ^4.1.0
  # The effect-platform-* packages: BrowserFileSystem needs FileSystem's
  # DirectoryEntry and lstat, and SpeechSynthesis `Semaphore.takeScoped`,
  # all first in Effect 4.1.0.
  platform-peers:
    "@effect/platform-browser": ^4.1.0
    effect: ^4.1.0

overrides:
  # Security floor on a transitive dev dependency (GHSA-g3hv-75wg-m249); drop
  # it once its parent resolves past it.
  "@ts-morph/common>minimatch": ^11.0.1
  # One copy of `effect`: two break Context / Layer / Schema identity.
  effect: "catalog:"
  "@effect/platform-node-shared": "catalog:"
  vite@*: "catalog:"
  vitest@*: "catalog:"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true
# Agent skills dependencies ship (pnpm 12.11+). `fallow` ships `fallow` and
# `fallow-setup`; only `fallow` is linked, since the repository is already set
# up. Build grants stay in `allowBuilds`: a `permissions` entry without `build`
# leaves its package's `allowBuilds` grant in force.
permissions:
  fallow:
    skills: [fallow]
skills:
  dirs: [.claude/skills]
peerDependencyRules:
  allowedVersions:
    # docgen's `tsconfck` never calls the API that needs this optional peer.
    "tsconfck>typescript": "6"

# Hold new versions for 24 hours (minutes); Dependabot's cooldown matches it.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@thomasfosterau/*"
# Vite+ selects Node.js (.node-version) and pnpm (packageManager); pnpm
# must not download or switch to its own.
runtimeOnFail: ignore
pmOnFail: ignore
# docgen runs its examples with `tsx`, which scripts/bin/tsx stands in for
# (through vpx), so its `tsx` peer is optional and never installed.
packageExtensions:
  "@effect/docgen":
    peerDependenciesMeta:
      tsx:
        optional: true
