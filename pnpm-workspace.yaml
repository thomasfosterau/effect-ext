# pnpm workspace for `effect-ext`, a single published package at the root.
#
# The `catalog:` protocol pins versions that MUST be singletons. Effect
# especially: two copies of `effect` break Context / Layer / Schema identity
# at runtime.
#
# EVERY external dependency version lives here — package.json references only
# `catalog:` / `catalog:peers`. `catalogMode: strict` makes `pnpm add` enforce
# this at add time and `pnpm install` reject non-catalog specifiers. After
# editing this catalog, ALWAYS run `pnpm install` and commit the regenerated
# pnpm-lock.yaml — a stale lockfile fails CI at once with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# The shared toolchain (vite-plus, effect, fallow) is kept in lockstep with
# the effect-web library, the family's reference workspace.
catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  # Lockstep with `effect`: @effect/vitest is released on the same version line.
  "@effect/vitest": ^4.0.6
  # The Effect lint preset (`effect/*` rules, anti-slop included), loaded by
  # the oxlint vite-plus carries: it moves with `vite-plus` (toolchain group).
  "@enfect/oxlint": ^0.9.0
  "@types/node": ^26.6.5
  # Must equal the vitest that vite-plus bundles (see `vitest` below); vite-plus
  # refuses to run coverage on a mismatch.
  "@vitest/coverage-istanbul": 5.0.5
  effect: ^4.0.6
  fallow: 3.37.0
  # TypeScript 7 (the native Go compiler): `tsc` for the `check` task and the
  # declaration generator `vp pack` uses (`dts.generator: "tsgo"`).
  typescript: ^7.0.2
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions: 1.4.0
  # carries oxlint 1.89.0, oxfmt 0.74.0 and vitest 5.0.5. `vite` is the same
  # release under its aliased core package, and `vitest` must match
  # vite-plus's exact pin because the `vitest@*: "catalog:"` override forces
  # every resolution to the catalog singleton.
  vite-plus: 1.4.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5

# Peer ranges the PUBLISHED package declares. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges. `pnpm
# publish` replaces `catalog:peers` with these ranges in the published
# manifest.
catalogs:
  peers:
    effect: ^4.0.6

overrides:
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version, including the exact 4.1.0 that @enfect/oxlint
  # declares (the lint rules run fine on the singleton).
  effect: "catalog:"
  # Vite+'s managed pins (`vp migrate`): the `@*` range rewrites the semver
  # specs transitive and peer declarations use, leaving `catalog:` intact.
  vite@*: "catalog:"
  vitest@*: "catalog:"
allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# Supply-chain delay (owner's policy, gardeneria #1149, relaxed to 8 hours on
# 2026-10-30): hold newly published versions for 480 MINUTES before pnpm will
# install them. Dependabot's `cooldown` (whole days only) is 1 day, longer than
# this, so it never proposes a version pnpm would still refuse.
minimumReleaseAge: 480
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
