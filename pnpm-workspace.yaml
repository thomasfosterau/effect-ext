# pnpm workspace settings for the single published package at the root.
#
# There is no `packages:` list: the repository root IS
# @thomasfosterau/effect-time. The file exists for the catalog, the overrides
# and the supply-chain settings below, which pnpm reads only from here.
#
# The `catalog:` protocol pins versions that MUST be singletons. Effect
# especially: two copies of `effect` break Context / Layer / Schema identity
# at runtime.
#
# EVERY external dependency version lives here — package.json references only
# `catalog:` / `catalog:peers`. `catalogMode: strict` makes `pnpm add` enforce
# this at add time and `pnpm install` reject non-catalog specifiers. After
# editing this catalog, ALWAYS run `pnpm install` and commit the regenerated
# pnpm-lock.yaml — a stale lockfile fails CI at once with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# Versions follow the family's library reference (effect-web) wherever the two
# overlap: `effect`, the TypeScript 6/7 pair, fallow, docgen.
catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  # Compiles AND RUNS every JSDoc `@example` (the `docgen` task); needs `tsx`
  # and a TypeScript JS API — the TS6 alias below satisfies its peer.
  "@effect/docgen": ^4.0.6
  "@effect/language-service": ^0.87.5
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` binary
  # with an Effect-patched build matched by gitHead, so this pins in lockstep
  # with `@typescript/native` below and with the `oxlint` and
  # `oxlint-tsgolint` that `vite-plus` pulls in: 0.63.0 supports typescript
  # 7.0.2, oxlint 1.88.0 – 1.90.0 and tsgolint 7.0.2004 / 7.0.2005; vite-plus
  # 1.4.0 carries oxlint 1.89.0 and tsgolint 7.0.2004.
  # Each @effect/tsgo release hard-errors (UnsupportedTargetPackageVersionError)
  # on any other component version, failing `pnpm install` itself. Read the
  # `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs
  # before bumping any of the three.
  "@effect/tsgo": 0.63.0
  # The Effect oxlint rules (`effect/*`, `configs.recommended`, the
  # anti-slop rules included), loaded by vite-plus's oxlint as a JS plugin.
  # It depends on `effect` 4.1.0 (exact) but runs on the singleton the
  # `effect` override below forces. Its `vite.config.ts` load calls Effect
  # APIs, so an `effect` bump re-runs `vp check` against the plugin too.
  # Moves in the `toolchain` Dependabot group (it loads inside oxlint).
  "@enfect/oxlint": ^0.9.0
  # The parser combinators behind `Rfc3339` and `IsoDuration`; a peer as well
  # (see `catalogs.peers`), so this is the copy the tests and docgen run on.
  "@thomasfosterau/effect-parse": ^0.4.0
  "@types/node": ^26.6.6
  # Must equal the vitest that vite-plus bundles (see `vitest` below); vite-plus
  # refuses to run coverage on a mismatch.
  "@vitest/coverage-istanbul": 5.0.5
  effect: 4.0.5
  fallow: 3.37.0
  # Runs docgen's compiled examples.
  tsx: ^4.23.15
  # TypeScript 6/7 side-by-side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service, tsdown's
  # declaration bundler, @effect/docgen) stay on TS6 while native `tsc`
  # type-checks. The alias keeps the package importable as `typescript`
  # name-stable at the TS6 JS compiler (bin `tsc6`); `@typescript/native` is
  # TS7 (bin `tsc`). Pinned exact: @typescript/native's gitHead must match
  # @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions, so this
  # entry decides the oxlint version `effect-tsgo patch --oxlint` has to
  # support (see the @effect/tsgo note above): 1.4.0 carries oxlint 1.89.0,
  # oxfmt 0.74.0, tsgolint 7.0.2004 and vitest 5.0.5. `vite` is the same
  # release under its aliased core package, and `vitest` must match vite-plus's exact pin because the
  # `vitest: "catalog:"` override forces every resolution to the catalog
  # singleton.
  vite-plus: 1.4.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5

# Peer ranges the PUBLISHED package declares. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges. `pnpm
# publish` replaces `catalog:peers` with these ranges in the published
# manifest.
catalogs:
  peers:
    # effect-parse declares `effect: ^4.0.0`, so 4.0.0 is the floor this
    # package can honestly claim (the family's earlier floor, rc.118, is below
    # it). Every `effect/*` path `src/` imports exists from 4.0.0 on.
    effect: ^4.0.0
    # A peer, not a dependency, for the same reason as `effect`: it carries
    # `ParseError` and `Parser` values a consumer composes with, and it peers
    # on `effect` itself.
    "@thomasfosterau/effect-parse": ^0.4.0

overrides:
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: "catalog:"
  # Vite+'s managed overrides (`vp migrate` writes them under these keys):
  # every `vite` / `vitest` resolution is the catalog singleton.
  "vite@*": "catalog:"
  "vitest@*": "catalog:"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
    # @effect/docgen declares `typescript: ^5`; the workspace's `typescript`
    # is the TS6 alias (see the catalog note).
    - typescript
  allowedVersions:
    vite: "*"
    vitest: "*"
    typescript: "*"

# Supply-chain delay (owner's policy, gardeneria #1149, relaxed to 8 hours on
# 2026-10-30): hold newly published versions for 8 hours (unit: MINUTES)
# before pnpm will install them. Dependabot's `cooldown` (whole days only) is
# 1 day, longer than this, so it never proposes a version pnpm would refuse.
minimumReleaseAge: 480
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
