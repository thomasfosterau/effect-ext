name: CI

# One job per Node version (the `engines.node` floor and the current LTS): the
# task graph lives in vite.config.ts, not in `needs:`. Nothing here needs a database, a stage or a credential, so every
# PR runs the whole gate.

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the single job grants only read access. The job
# needs no secrets and no OIDC token, so a Dependabot PR runs it with nothing
# to leak. Every action is locked to its commit by .github/workflows/actions.lock
# (Dependabot's `github-actions` updates keep the tags current).
permissions: {}

jobs:
  ci:
    name: ci (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The `engines.node` floor and the current LTS.
        node-version: ["22", "24"]
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Vite+ (at the catalog's `vite-plus` pin), Node and the
      # `packageManager` pnpm, the pnpm store cache, then `vp install`
      # (frozen lockfile in CI). The matrix pins a major, never `latest`.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ matrix.node-version }}
          version-file: pnpm-workspace.yaml
          cache: true
      # Vite Task does not fingerprint the Node version, so the task cache is
      # keyed on the resolved version: otherwise a run on a new patch release
      # would replay the previous one's results for every task whose inputs
      # are unchanged.
      # Also prints the resolved version in the step list.
      - name: Resolve the Node version
        id: node
        run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"
      - name: Restore the Vite+ task cache (Node ${{ steps.node.outputs.version }})
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-node-${{ steps.node.outputs.version }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-node-${{ steps.node.outputs.version }}-
      - name: Format and lint
        run: vp check
      - name: Type gates (src, type-level tests, emitted declarations)
        run: vp run --concurrency-limit 2 check
      - name: Unit tests
        run: vp run -r test:unit
      # The suites again under Istanbul, failing if any package's coverage
      # drops below its floor (`coverageFloor` in each package's
      # vite.config.ts). `-r` runs each package's own suite against only its
      # own tests: the root task alone merges every package's tests into one
      # map, so another package's tests can cover a file and hide a drop.
      - name: Coverage floors
        run: vp run -r test:coverage
      - name: Build
        run: vp run -r build
      # Imports every built entry under real Node ESM and checks every value
      # export its declarations promise exists at runtime, type-checks the
      # bundled declarations, then launches the `effect-evals` bin from a
      # packed tarball (`scripts/check-dist.mjs`).
      - name: Dist import check
        run: vp run check:dist
      # Type-checks AND runs every JSDoc @example against the built dist/.
      - name: Verify documentation examples (docgen)
        run: vp run docgen
      - name: Audit
        run: pnpm audit --audit-level high
