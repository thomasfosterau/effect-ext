name: CI

# One command, `vp run ci` (vite.config.ts), so a local run is the same gate.

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

permissions: {}

jobs:
  ci:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [lts, latest]
    env:
      # Inherited by every child process, each vitest fork included.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        id: setup
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ matrix.node }}
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: true
      # Keyed on the resolved Node version: Vite Task doesn't fingerprint it,
      # so a new release would otherwise replay the previous one's results.
      - name: Restore the Vite+ task cache
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-node-${{ steps.setup.outputs.node-version }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-node-${{ steps.setup.outputs.node-version }}-
      - name: CI gate
        run: vp run ci

  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVCONTAINER_CLI: "@devcontainers/cli@0.90.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Only to run the devcontainers CLI; the container installs its own toolchain.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: lts
          version-file: pnpm-workspace.yaml
          cache: false
          run-install: false
      - name: Build and start the container
        run: vp dlx "$DEVCONTAINER_CLI" up --workspace-folder .
      - name: Check vp inside the container
        run: vp dlx "$DEVCONTAINER_CLI" exec --workspace-folder . vp --version
