name: CI

# One command: `vp run ci` (the `ci` task in vite.config.ts), so CI and a local
# run are the same gate. It runs on the current LTS and the latest Node
# release; the `ci` job at the end is the one stable check name for rulesets.
# Nothing here needs a database, a stage or a credential, so every PR runs the
# whole gate.

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the jobs grant only read access. Nothing needs
# secrets or an OIDC token, so a Dependabot PR runs it with nothing to leak.
# Every action is pinned (Dependabot's `github-actions` updates keep the pins
# current).
permissions: {}

jobs:
  test:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [lts, latest]
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vite+ (at the catalog's `vite-plus` pin), the matrix's Node and the
      # `packageManager` pnpm, the pnpm store cache, then
      # `vp install --frozen-lockfile`.
      - name: Setup Vite+
        id: setup
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ matrix.node }}
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      # Vite Task does not fingerprint the Node version, so the task cache is
      # keyed on the version setup-vp resolved (`lts` / `latest` move):
      # otherwise a run on a new release would replay the previous one's
      # results for every task whose inputs are unchanged.
      - name: Restore the Vite+ task cache (Node ${{ steps.setup.outputs.node-version }})
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-node-${{ steps.setup.outputs.node-version }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-node-${{ steps.setup.outputs.node-version }}-
      - name: CI gate
        run: vp run ci

  # The one stable check name (`ci`) for required-check rulesets, whatever the
  # matrix holds.
  ci:
    name: ci
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every matrix job passed
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
