name: CI

# Shaped like the effect-web library's CI (the family standard): the pipeline's
# gates run in one job per Node version, in the order AGENTS.md#verification
# lists them. Nothing here needs a database, a stage or a credential, so every
# PR class runs the whole gate.

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; each job grants only read access.
permissions: {}

jobs:
  ci:
    name: ci (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The `engines.node` floor and the current LTS.
        node-version: ["22", "24"]
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-node${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-node${{ matrix.node-version }}-
      - name: Format and lint
        run: pnpm exec vp check
      - name: Type gate
        run: pnpm exec vp run check
      - name: Unit tests
        run: pnpm exec vp run -r test:unit
      - name: Build
        run: pnpm exec vp run -r build
      - name: Audit
        run: pnpm audit --audit-level high
