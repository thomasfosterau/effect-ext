# Assigns the owner to every pull request that opens without an assignee.
#
# `pull_request`, never `pull_request_target`: the job runs no PR code (no
# checkout, no third-party action), only `gh pr edit`, with the workflow's
# own token scoped to `pull-requests: write`. Dependabot's PRs are skipped:
# `.github/dependabot.yml` assigns them itself, and a Dependabot-triggered
# run gets a read-only token anyway. A PR opened with the default
# GITHUB_TOKEN (the Release workflow's `chore: version packages`) triggers
# no workflow, so it is not assigned here.
name: Auto-assign

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  assign:
    name: assign the owner
    if: >-
      github.actor != 'dependabot[bot]' &&
      toJSON(github.event.pull_request.assignees) == '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # add an assignee to the PR
    steps:
      - name: Assign thomasfosterau
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee thomasfosterau
