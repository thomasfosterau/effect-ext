name: Release

# Changesets, split so only publishing waits for approval: `select` picks
# `version` (open/update the version PR), `publish` (some version isn't on npm
# yet) or `none`. Only `publish` runs in the protected `release` environment
# and holds `id-token: write` (trusted publishing through pnpm's OIDC
# exchange; no NPM_TOKEN).
# Privileged jobs install with `--ignore-scripts` and no cache.

on:
  push:
    branches: [trunk]

permissions: {}

jobs:
  verify-lockfile:
    if: github.repository == 'thomasfosterau/effect-ext' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify the workflow lockfile
        run: gh actions-lock --verify

  select:
    name: Select mode
    needs: verify-lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env:
      # Stops `pnpm run` / `pnpm exec` re-installing with lifecycle scripts.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: lts
          version-file: pnpm-workspace.yaml
          cache: false
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Version packages
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write # commit to `changeset-release/trunk`
      pull-requests: write # open/update the version PR
    env:
      pnpm_config_verify_deps_before_run: "false"
    steps:
      # The sub-action pushes through the GitHub API, not git.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: lts
          version-file: pnpm-workspace.yaml
          cache: false
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Create or update the version PR
        id: version
        uses: changesets/action/version@v2.1.2
        with:
          script: vp run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
      - name: Assign the owner to the version PR
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: gh pr edit "$PR_NUMBER" --add-assignee thomasfosterau

  publish:
    name: Publish to npm
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # push tags, create GitHub releases
      id-token: write # trusted publishing (pnpm's OIDC exchange)
    env:
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: lts
          version-file: pnpm-workspace.yaml
          cache: false
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      # `vp pack` needs no `prepare`: the tsgo patch only adds diagnostics.
      - name: Build
        run: vp run -r build
      # `pnpm run release`: `pnpm -r publish` (skips versions already on npm,
      # does the OIDC exchange and adds provenance for a public repo itself),
      # then `changeset tag`.
      - name: Publish to npm
        uses: changesets/action/publish@v2.1.2
        with:
          script: pnpm run release
