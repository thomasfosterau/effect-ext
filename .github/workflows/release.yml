name: Release

# Changesets release flow, split so that only publishing waits for approval.
# On every push to `trunk`:
#
# - `select` (no permissions) asks changesets/action/select-mode what the repo
#   state calls for: `version` while unreleased changesets exist, `publish`
#   once none remain and some package version is not on npm yet (from
#   `changeset publish-plan`), else `none`.
# - `version` opens/updates the "chore: version packages" PR. It holds a
#   write-scoped token but no `id-token`, so it cannot publish, and runs
#   outside the `release` environment, so it needs no approval.
# - `publish` is the only job in the protected `release` environment and the
#   only one with `id-token: write`: it publishes to npm via OIDC trusted
#   publishing and tags the release. It waits for the owner's approval, once
#   per release.
#
# There is no NPM_TOKEN; see PUBLISHING.md for the one-time setup and
# SECURITY.md for the rationale. changesets/action's README recommends the
# sub-actions over the combined action for trusted publishing, "to tighten
# publish permissions"; they need Changesets CLI v3.

on:
  push:
    branches: [trunk]

# No permissions by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  select:
    name: Select mode
    # Never on forks (no environment, no trusted publisher binding), and never
    # for Dependabot: the later jobs hold write-scoped tokens and `id-token`.
    if: github.repository == 'thomasfosterau/effect-ext' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env:
      # See the `publish` job: keeps `pnpm run` / `pnpm exec` from re-installing
      # with lifecycle scripts after the `--ignore-scripts` install.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # `version`, `publish` or `none`. For `publish` it reads the registry
      # (no credentials needed) to find the versions not yet on npm.
      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version packages
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A newer push supersedes an older refresh of the version PR.
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write # commit the version changes to `changeset-release/trunk`
      pull-requests: write # open/update the "chore: version packages" PR
    env:
      pnpm_config_verify_deps_before_run: "false"
    steps:
      # The version sub-action commits and pushes through the GitHub API (not
      # the git CLI), so the checkout keeps no credentials.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create or update the version PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    name: Publish to npm
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Requires manual approval via a protected GitHub Environment named
    # "release". See PUBLISHING.md for the one-time setup.
    environment: release
    # One publish at a time; never cancel one that has started.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # push the release tags and create the GitHub releases
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before any
      # `pnpm run` / `pnpm exec` it compares node_modules with the manifests
      # and, if a manifest looks newer than the last install, re-installs
      # WITH lifecycle scripts, ignoring the `--ignore-scripts` of the install
      # step below. That re-install would run the root `prepare` (`vp config` +
      # `effect-tsgo patch`) and every `allowBuilds` dependency's build script
      # inside this job, which holds `id-token: write`. The top-level
      # `pnpm run` calls are the entry points: commands nested inside a
      # `pnpm run` script (scripts/release.sh's `pnpm exec changeset tag`)
      # already inherit `pnpm_config_verify_deps_before_run=false` from pnpm.
      # pnpm 11 reads only the `pnpm_config_*` spelling for this setting;
      # `npm_config_verify_deps_before_run` is ignored.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      # The publish sub-action pushes tags through the GitHub API, so the
      # checkout keeps no credentials.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Installs the pnpm version pinned by the package.json "packageManager"
      # field. Must run before setup-node so its pnpm cache can find the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # A pinned major (the `engines.node` floor CI also tests), never
      # `latest`: setup-node resolves `latest` to the first nodejs.org index
      # entry, pre-releases included, which would publish from an alpha Node
      # (effect-svelte#214).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          check-latest: true
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # scripts/release.sh publishes each `pnpm pack` tarball with the npm CLI
      # (`npm publish`), and npm's own OIDC trusted publishing needs
      # npm >= 11.5.1, newer than the npm Node 22 bundles, so the npm in this
      # id-token job is pinned here rather than inherited from Node. Pinned to an
      # exact version rather than `@latest`, so what runs is a version that
      # was reviewed, not whatever the registry serves on the day (`@latest`
      # is already npm 12). Bump it by hand; Dependabot does not see it.
      - name: Upgrade npm (OIDC trusted publishing)
        run: npm install -g npm@11.20.0

      # --ignore-scripts stops a compromised dependency from running install
      # scripts in the privileged publish job (the Shai-Hulud vector). The
      # build below runs on the unpatched native tsc, which emits the same
      # `dist/` the Effect-patched one does — the patch only adds diagnostics.
      # It only holds because `pnpm_config_verify_deps_before_run` is off for
      # this job (see the job `env` above).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

      # Runs `pnpm run release` (scripts/release.sh), which packs each package
      # with `pnpm pack` and publishes it with `npm publish` (OIDC trusted
      # publishing — there is no NPM_TOKEN to steal) and then `changeset tag`.
      # The sub-action parses the "New tag:" output, pushes the tags and
      # creates the GitHub releases.
      #
      # Provenance is left to npm: with no explicit provenance setting, npm
      # (>= 11.5.1, under trusted publishing) attaches it only when the OIDC
      # token reports a public repository AND the registry reports the
      # package as public. Do not force it: `NPM_CONFIG_PROVENANCE=true` or
      # `--provenance` is read by the npm CLI and makes the publish FAIL from
      # a private repository.
      - name: Publish to npm
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run release
