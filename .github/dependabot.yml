# Dependabot version updates. The `npm` ecosystem at `/` reads the pnpm
# workspace and its catalogs (pnpm-workspace.yaml), where every version lives.
#
# Groups exist only for sets that MUST move together (one release train with
# exact cross-pins, or a hard compatibility table), so a lockstep set arrives
# as one PR instead of several that are each red on their own. Everything
# else, majors and minors alike, gets its own PR. Dependabot puts a
# dependency in the FIRST group that matches it, and `exclude-patterns` keeps
# a package out of a group that would otherwise claim it.
#
# - `toolchain`: vite-plus pins the `oxlint`, `oxfmt`, `oxlint-tsgolint` and
#   `vitest` it carries; `vite` is vite-plus's aliased core package;
#   `@vitest/coverage-istanbul` has an exact peer on `vitest`; and
#   `effect-tsgo patch` (the `prepare` script) hard-errors
#   (UnsupportedTargetPackageVersionError) on any `@typescript/native` /
#   oxlint pairing its `components` table does not list, failing
#   `pnpm install` itself.
#   A toolchain PR whose `@effect/tsgo` does not yet support the new oxlint
#   goes red: fix it by hand on the PR (see the catalog comments in
#   pnpm-workspace.yaml) rather than merging part of the set.
# - `effect`: the Effect 4 release line (`effect` and the `@effect/*`
#   packages released with it) is a lockstep-versioned singleton set.
#   `@effect/docgen` is on the same line and belongs here: it depends on
#   `effect` itself, and the `effect` override forces the catalog pin onto
#   it, so a docgen ahead of `effect` crashes on launch (4.1.x needs
#   `effect ^4.1.2`). Only the dev pin moves: the published peer floor
#   (`catalogs.peers.effect`, a `>=` range) is a tested claim that
#   Dependabot has never rewritten (#60, #63), and it is never Dependabot's
#   to move (AGENTS.md, Common pitfalls). `@effect/tsgo` is the toolchain's
#   and `@effect/language-service` is on its own release line, so neither
#   is in it.
#
# By hand, never by Dependabot (it cannot rewrite them):
# - the npm-alias catalog entries: `vite`
#   (`npm:@voidzero-dev/vite-plus-core@<v>`, must equal `vite-plus`),
#   `typescript` (`npm:@typescript/typescript6@<v>`) and `@typescript/native`
#   (`npm:typescript@<v>`, must match `@effect/tsgo`'s components table).
#   Set them on the `toolchain` PR that moves their partner.
# - `@effect/platform-node-shared` (equal to `effect`): named only in the
#   catalog and `overrides`, so Dependabot's `effect` group never proposes
#   it. Bump it by hand to the same version in the `effect` PR.
# - the `overrides` literals in pnpm-workspace.yaml (`undici`, a security
#   floor; drop it once nothing resolves below the fix) and the catalog's
#   `catalogs.peers` floors.
# - the npm version the Release workflow installs (`npm install -g npm@…`).
#
# `cooldown` waits 1 day, Dependabot's smallest unit (whole days only). That
# is longer than pnpm-workspace.yaml's `minimumReleaseAge` (480 minutes, 8
# hours), so a Dependabot PR never proposes a version pnpm would still refuse.
# It keeps the `@thomasfosterau/*` exemption pnpm has.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      # vite-plus pins oxlint and vitest exactly, and @effect/tsgo's patch
      # supports only the oxlint / TypeScript pairs its components table lists.
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "@voidzero-dev/*"
          - "vitest"
          - "@vitest/*"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
        update-types: ["major", "minor", "patch"]
      # One Effect release train with exact cross-pins; docgen depends on
      # `effect` and must not run ahead of it.
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/language-service"
        update-types: ["major", "minor", "patch"]
    assignees:
      - thomasfosterau
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    assignees:
      - thomasfosterau
  # The Dev Container features in .devcontainer/devcontainer.json. No group:
  # each feature updates on its own PR. The image tag is a hand move (it
  # follows the catalog's `vite-plus` pin; see the comment beside it).
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    assignees:
      - thomasfosterau
